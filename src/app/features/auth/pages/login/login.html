<div class="sm:p-12 m-auto sm:shadow-main sm:bg-white rounded-[8px] w-[100%] sm:w-[576px] w-full mt-12">
  <div class="mb-10">
    <h1 class="text-[28px] sm:text-center sm:text-title-md font-semibold text-neutral-900">
      Welcome Back
    </h1>
    <p class="text-[14px] sm:text-center text-neutral-600">
      Please enter your details to access your workspace
    </p>
  </div>

  <form class="flex gap-6 flex-col" [formGroup]="loginFormData" (ngSubmit)="onSubmit()">
    <app-input-field
      placeholder="yourname@company.com"
      label="email"
      type="email"
      name="email"
      [inputControl]="email"
    ></app-input-field>

    <app-input-field
      placeholder="Password"
      label="password"
      type="password"
      name="password"
      [inputControl]="password"
    ></app-input-field>

    <div class="flex items-center justify-between">
      <div class="flex-center gap-2">
        <input
          type="checkbox"
          [formControl]="rememberMe"
          class="accent-primary border-1 border-[#C3C6D6] w-[16px] h-[18px] cursor-pointer"
        />
        <label class="body-md">Remember Me</label>
      </div>
      <a class="text-primary font-medium text-body-md" routerLink="/forget-password"
        >Forget Password?</a
      >
    </div>

    <button
      type="submit"
      class="btn-primary cursor-pointer rounded-[4px] w-full h-[48px] flex-center gap-3"
      [class.opacity-70]="isLoading"
      [disabled]="isLoading"
    >
      Log In 

      @if (isLoading) {
        <app-btn-loading />
      }
    </button>

    <p class="text-neutral-600 text-center mt-8">
      Don't have an account? <a class="text-primary font-semibold" routerLink="/sign-up">Sign Up</a>
    </p>
  </form>
</div>
