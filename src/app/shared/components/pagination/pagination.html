<div class="hidden md:block">
  <div class="gap-5 flex items-center justify-between">
    <p class="font-medium text-[12px] text-description">
      Showing {{ limit }} of {{ totalProjectsCount() }} active projects
    </p>

    <div class="flex-center w-fit gap-2">
      <!-- Previous -->
      <div
        class="border-1 rounded-[2px] border-[#C3C6D64D] cursor-pointer hover:bg-gray-200 flex-center w-[32px] h-[32px]"
        (click)="previous()"
        [ngClass]="{
          'disable !cursor-auto !bg-transparent': currentPage() === 1,
        }"
      >
        <svg
          width="5"
          height="7"
          class="scale-[1.5]"
          viewBox="0 0 5 7"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          [class.opacity-35]="currentPage() === 1"
        >
          <path
            d="M3.5 7L0 3.5L3.5 0L4.31667 0.816667L1.63333 3.5L4.31667 6.18333L3.5 7Z"
            fill="#434654"
          />
        </svg>
      </div>

      <!-- Pagination Numbers -->
      @for (pageNumber of getPages(); track $index) {
        <div
          class="border-1 rounded-[2px] text-[12px] font-bold border-[#C3C6D64D] hover:bg-gray-200 cursor-pointer flex-center w-[32px] h-[32px]"
          [ngClass]="{
            '!bg-primary text-white !cursor-auto disabled': currentPage() === pageNumber,
            'text-description': currentPage() !== pageNumber,
            '!border-0 !cursor-auto !bg-transparent mt-[-2px]': pageNumber === '...',
          }"
          (click)="selectPage(pageNumber)"
        >
          {{ pageNumber }}
        </div>
      }

      <!-- Next -->
      <div
        class="border-1 hover:bg-gray-200 rounded-[2px] border-[#C3C6D64D] cursor-pointer flex-center w-[32px] h-[32px]"
        (click)="next()"
        [ngClass]="{
          'disable !cursor-auto !bg-transparent': currentPage() === totalPages(),
        }"
      >
        <svg
          width="5"
          height="7"
          class="scale-[1.5]"
          viewBox="0 0 5 7"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          [class.opacity-35]="currentPage() === totalPages()"
        >
          <path
            d="M2.68333 3.5L0 0.816667L0.816667 0L4.31667 3.5L0.816667 7L0 6.18333L2.68333 3.5Z"
            fill="#434654"
          />
        </svg>
      </div>
    </div>
  </div>
</div>
