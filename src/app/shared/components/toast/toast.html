<div
  class="fixed border-l-[3px] right-4 hide transition-all duration-300 z-[1000] w-[90%] max-w-[350px] overflow-hidden rounded-xl border border-slate-200 bg-white/95 shadow-[0_20px_50px_-15px_rgba(15,23,42,0.35)] backdrop-blur-sm"
  [ngClass]="{
    'border-l-rose-600': toastService.messageType() === 'error',
    'border-l-amber-500': toastService.messageType() === 'warning',
    'border-l-emerald-500': toastService.messageType() === 'success',
    show: toastService.isVisible(),
    hide: !toastService.isVisible(),
  }"
>
  <div class="flex items-start gap-3 p-3 py-4">
    <div
      class="mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
      [ngClass]="{
        'bg-rose-100': toastService.messageType() === 'error',
        'bg-amber-100 ': toastService.messageType() === 'warning',
        'bg-emerald-100': toastService.messageType() === 'success',
      }"
    >
      @if (toastService.messageType() === 'error') {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red" class="size-8">
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z"
            clip-rule="evenodd"
          />
        </svg>
      } @else if (toastService.messageType() === 'warning') {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="darkorange"
          class="size-7"
        >
          <path
            fill-rule="evenodd"
            d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
            clip-rule="evenodd"
          />
        </svg>
      } @else if (toastService.messageType() === 'success') {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="green"
          class="size-8"
          stroke="white"
        >
          <path
            fill-rule="evenodd"
            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
            clip-rule="evenodd"
          />
        </svg>
      }
    </div>

    <div class="flex-1">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div
            class="text-[15px] font-semibold capitalize"
            [ngClass]="{
              'text-rose-700': toastService.messageType() === 'error',
              'text-amber-700': toastService.messageType() === 'warning',
              'text-emerald-700': toastService.messageType() === 'success',
            }"
          >
            {{ toastService.messageTitle() }}
          </div>
          <div class="mt-1 text-[13px] leading-5 text-slate-600">
            {{ toastService.messageContent() }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <button
    type="button"
    class="absolute top-0 right-3 text-slate-400 transition hover:text-slate-600 cursor-pointer text-[26px]"
    (click)="toastService.hide()"
    aria-label="Close toast"
  >
    ×
  </button>
</div>
