<nav
  class="p-4 overflow-hidden bg-[#F1F3FF] z-3 absolute translate-x-[-100%] sm:translate-x-0 sm:sticky left-0 top-0 h-[100dvh] flex flex-col gap-8 duration-300"
  [ngClass]="{
    'sm:w-[256px]': !isCollapsed,
    'w-[256px] sm:w-[80px]': isCollapsed,
    '!translate-x-0': isSideAppear,
  }"
>
  <div class="logo flex-center w-fit gap-2 h-10 px-3">
    <svg width="18" height="20" viewBox="0 0 18 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M9 20L0 15V5L9 0L18 5V15L9 20ZM6.1 7.25C6.48333 6.85 6.925 6.54167 7.425 6.325C7.925 6.10833 8.45 6 9 6C9.55 6 10.075 6.10833 10.575 6.325C11.075 6.54167 11.5167 6.85 11.9 7.25L14.9 5.575L9 2.3L3.1 5.575L6.1 7.25ZM8 17.15V13.875C7.1 13.6417 6.375 13.1667 5.825 12.45C5.275 11.7333 5 10.9167 5 10C5 9.81667 5.00833 9.64583 5.025 9.4875C5.04167 9.32917 5.075 9.16667 5.125 9L2 7.25V13.825L8 17.15ZM9 12C9.55 12 10.0208 11.8042 10.4125 11.4125C10.8042 11.0208 11 10.55 11 10C11 9.45 10.8042 8.97917 10.4125 8.5875C10.0208 8.19583 9.55 8 9 8C8.45 8 7.97917 8.19583 7.5875 8.5875C7.19583 8.97917 7 9.45 7 10C7 10.55 7.19583 11.0208 7.5875 11.4125C7.97917 11.8042 8.45 12 9 12ZM10 17.15L16 13.825V7.25L12.875 9C12.925 9.16667 12.9583 9.32917 12.975 9.4875C12.9917 9.64583 13 9.81667 13 10C13 10.9167 12.725 11.7333 12.175 12.45C11.625 13.1667 10.9 13.6417 10 13.875V17.15Z"
        fill="#0052CC"
      />
    </svg>

    <h1
      class="font-bold text-[20px] text-neutral-900 whitespace-nowrap show transition-all duration-200"
      [class.hide-lnk-txt]="isCollapsed"
    >
      TASKLY
    </h1>
  </div>

  <div class="flex flex-col justify-between h-fit flex-2">
    <ul class="flex flex-col gap-1">
      @for (linkItem of navbarLinks; track $index) {
        <li
          routerLinkActive="!text-primary bg-white shadow-[0px_1px_2px_0px_#0000000D]"
          class="text-neutral-900 rounded-[4px] w-full sm:w-full py-3 px-3.5 h-[48px] transition-all duration-200 overflow-hidden"
          [ngClass]="{
            'sm:!text-[#041B3C99]': isCollapsed,
            'sm:!w-[48px]': isCollapsed,
          }"
        >
          <a
            class="flex items-center h-[100%] gap-3 text-inherit text-body-md font-medium"
            routerLink="{{ linkItem.path }}"
          >
            <span class="w-[20px] h-fit" [innerHTML]="getIcon(linkItem.icon)"></span>

            <span
              class="whitespace-nowrap show transition-all duration-200"
              [class.hide-lnk-txt]="isCollapsed"
            >
              {{ linkItem.name }}
            </span>
          </a>
        </li>
      }
    </ul>

    <div class="flex flex-col gap-1 border-t-1 border-[#C3C6D633] pt-8">
      <div class="hidden sm:block">
        <button
          class="w-fit flex-center rounded-[4px] gap-3 py-2.5 px-3 text-neutral-900 text-body-md font-medium overflow-hidden"
        >
          <svg
            width="10"
            height="15"
            [class.rotate-180]="isCollapsed"
            class="transition-all duration-300 cursor-pointer"
            viewBox="0 0 12 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            (click)="isCollapsed = !isCollapsed"
          >
            <path d="M10 20L0 10L10 0L11.775 1.775L3.55 10L11.775 18.225L10 20Z" fill="#041B3C" />
          </svg>

          <span
            class="whitespace-nowrap show transition-all duration-200 cursor-pointer"
            [class.hide-lnk-txt]="isCollapsed"
            (click)="isCollapsed = !isCollapsed"
          >
            Collapse
          </span>
        </button>
      </div>

      <button
        class="w-fit flex-center rounded-[4px] gap-3 py-2.5 px-3 text-neutral-900 text-body-md font-medium overflow-hidden"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="cursor-pointer"
          (click)="logout()"
        >
          <path
            d="M2 18C1.45 18 0.979167 17.8042 0.5875 17.4125C0.195833 17.0208 0 16.55 0 16V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H9V2H2V16H9V18H2ZM13 14L11.625 12.55L14.175 10H6V8H14.175L11.625 5.45L13 4L18 9L13 14Z"
            fill="#BA1A1A"
          />
        </svg>

        <span
          class="text-error whitespace-nowrap show transition-all duration-200 cursor-pointer"
          [class.hide-lnk-txt]="isCollapsed"
          (click)="logout()"
        >
          Logout
        </span>
      </button>
    </div>
  </div>
</nav>
