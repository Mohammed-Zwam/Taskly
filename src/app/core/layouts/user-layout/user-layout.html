<div class="flex relative">
  <app-side-navbar [isSideAppear]="isSideAppear"></app-side-navbar>

  @if (isSideAppear()) {
    <div
      (click)="isSideAppear.set(false)"
      class="block lg:hidden backdrop-blur-[4px] bg-[#041B3C66] z-[12] duration-200 transition-all fixed w-[100%] h-[100%] top-0 left-0"
    ></div>
  }

  <!-- MAIN (PAGE CONTENT) -->
  <div class="w-full min-h-[100dvh]">
    <!-- HEADER -->
    <header
      class="h-[64px] px-6 py-3 border-b-1 border-[#0000001A] flex items-center justify-between sticky z-[10] top-0 bg-[#f1f3ff]"
    >
      <div class="block lg:hidden">
        <div class="flex-center gap-4">
          <svg
            width="18"
            height="12"
            viewBox="0 0 18 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="cursor-pointer"
            (click)="isSideAppear.set(true)"
          >
            <path d="M0 12V10H18V12H0ZM0 7V5H18V7H0ZM0 2V0H18V2H0Z" fill="#041B3C" />
          </svg>
          <h1
            class="font-bold text-[20px] text-neutral-900 whitespace-nowrap show transition-all duration-200"
          >
            TASKLY
          </h1>
        </div>
      </div>

      <div class="flex-center gap-4 w-fit ml-auto">
        <div class="hidden sm:block">
          <div class="flex flex-col gap-1 text-end">
            <h2 class="neutral-900 text-[14px] font-semibold">{{ userName }}</h2>
            <p class="text-primary text-[10px] font-bold tracking-[1px] uppercase">
              {{ userTitle }}
            </p>
          </div>
        </div>
        <div
          class="w-[40px] h-[40px] flex-center text-white rounded-[12px] bg-primary-container uppercase text-[16px] font-bold"
        >
          {{ avatar }}
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->

    <div class="py-4.5 pb-20 lg:pb-6 px-4 sm:px-8 min-h-[calc(100dvh-64px)] h-fit">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- BOTTOM NAVBAR (MOBILE) -->
  @if (!isSideAppear()) {
    <app-bottom-navbar></app-bottom-navbar>
  }
</div>
